<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>PDF to Text Converter — synthwave sun over grid</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101f"/>
      <stop offset="0.45" stop-color="#2a1a4a"/>
      <stop offset="0.75" stop-color="#6a1e8f"/>
      <stop offset="1" stop-color="#d43a8e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b83d"/>
      <stop offset="1" stop-color="#d43a8e"/>
    </linearGradient>
  </defs>

  <!-- rounded dark synthwave background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- retro striped sun -->
  <g>
    <circle cx="128" cy="106" r="52" fill="url(#sun)"/>
    <rect x="70" y="112" width="116" height="7" fill="#12101f"/>
    <rect x="70" y="126" width="116" height="9" fill="#12101f"/>
    <rect x="70" y="142" width="116" height="10" fill="#12101f"/>
  </g>

  <!-- perspective grid horizon -->
  <g stroke="#f2f2f7" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round">
    <line x1="28" y1="176" x2="228" y2="176"/>
    <line x1="44" y1="204" x2="212" y2="204"/>
    <line x1="64" y1="228" x2="192" y2="228"/>
  </g>
  <g stroke="#f2f2f7" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="176" x2="128" y2="228"/>
    <line x1="86" y1="176" x2="66" y2="228"/>
    <line x1="170" y1="176" x2="190" y2="228"/>
    <line x1="44" y1="176" x2="12" y2="228"/>
    <line x1="212" y1="176" x2="244" y2="228"/>
  </g>

  <!-- document fold, top-right -->
  <path d="M186 20 L232 20 L232 66 Z" fill="#f2f2f7" fill-opacity="0.18"/>
</svg>